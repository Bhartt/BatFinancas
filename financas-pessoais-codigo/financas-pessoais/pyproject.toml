[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "financas-pessoais-local"
version = "1.0.0"
description = "Controle financeiro pessoal desktop em português brasileiro"
requires-python = ">=3.11,<3.14"
dependencies = ["PySide6==6.8.3", "matplotlib==3.10.1", "numpy==2.2.4", "reportlab==4.3.1"]

[project.scripts]
financas-pessoais = "financas.__main__:main"

[tool.setuptools.packages.find]
include = ["financas*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
